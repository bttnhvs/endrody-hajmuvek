<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Endrődy Wigs</title>
  <!-- fehér korong: sötét böngészőfülön is látszik -->
  <circle cx="32" cy="32" r="31.5" fill="#fff"/>
  <!-- vékony zöld ív, mint a logón; jobb fent nyitott, ott ül a rózsa -->
  <path d="M56.5 20.6A27 27 0 1 1 41.2 6.6" fill="none" stroke="#8fc27d" stroke-width="4" stroke-linecap="round"/>
  <!-- levelek -->
  <path d="M44 15c-3-1-5 1-6 3 3 1 5 0 6-3z" fill="#668559"/>
  <path d="M55 20c1 3 0 5-2 6-1-3 0-5 2-6z" fill="#668559"/>
  <!-- rózsa -->
  <circle cx="50" cy="13" r="7" fill="#ee97ba"/>
  <path d="M50 9.6a3.4 3.4 0 1 1-3.2 4.6M50 11.6a1.5 1.5 0 1 0 1.5 1.5" fill="none" stroke="#a8406b" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Bodoni-jellegű E monogram: vastag szár, vékonyabb karok, talpak -->
  <g fill="#5e7d53">
    <rect x="21" y="19" width="7" height="27"/>
    <rect x="17.5" y="18" width="23" height="3.2"/>
    <rect x="37.6" y="18" width="3" height="8" rx="0.6"/>
    <rect x="21" y="30.6" width="13" height="3"/>
    <rect x="32" y="27.6" width="2.6" height="9" rx="0.6"/>
    <rect x="17.5" y="44" width="25" height="3.2"/>
    <rect x="39.6" y="38" width="3" height="9.2" rx="0.6"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

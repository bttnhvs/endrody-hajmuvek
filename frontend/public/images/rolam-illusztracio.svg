<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Illusztráció: rövid, vagány, szőke hajú, zöld szemű, mosolygó parókakészítő a műhelyében, mellette egy barna, göndör paróka a fejformán</title>
  <defs>
    <clipPath id="arch"><path d="M0 200A200 200 0 0 1 400 200V500H0Z"/></clipPath>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e2b4"/>
      <stop offset=".55" stop-color="#e3c086"/>
      <stop offset="1" stop-color="#b98e58"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#arch)">
    <!-- háttér -->
    <rect width="400" height="500" fill="#e5efdf"/>
    <circle cx="300" cy="120" r="150" fill="#f2f6ef"/>

    <!-- fejforma a háttérben, szőke fürtökkel -->
    <g transform="translate(250 230)">
      <rect x="40" y="150" width="30" height="120" fill="#c9bfae"/>
      <path d="M10 40c0-34 22-56 45-56s45 22 45 56c0 40-18 62-24 92H34C28 102 10 80 10 40Z" fill="#ece6dc"/>
      <g fill="#7a5233" stroke="#5a3a22" stroke-width="2">
        <circle cx="22" cy="10" r="16"/><path d="M14.8 10a7.2 7.2 0 1 1 7.2 7.2a3.52 3.52 0 0 1 -3.2 -4.8" fill="none"/><circle cx="48" cy="-8" r="18"/><path d="M39.9 -8a8.1 8.1 0 1 1 8.1 8.1a3.96 3.96 0 0 1 -3.6 -5.4" fill="none"/><circle cx="78" cy="2" r="17"/><path d="M70.35 2a7.65 7.65 0 1 1 7.65 7.65a3.74 3.74 0 0 1 -3.4 -5.1" fill="none"/>
        <circle cx="98" cy="30" r="15"/><path d="M91.25 30a6.75 6.75 0 1 1 6.75 6.75a3.3 3.3 0 0 1 -3 -4.5" fill="none"/><circle cx="102" cy="62" r="14"/><path d="M95.7 62a6.3 6.3 0 1 1 6.3 6.3a3.08 3.08 0 0 1 -2.8 -4.2" fill="none"/><circle cx="96" cy="92" r="13"/><path d="M90.15 92a5.85 5.85 0 1 1 5.85 5.85a2.86 2.86 0 0 1 -2.6 -3.9" fill="none"/>
        <circle cx="10" cy="40" r="14"/><path d="M3.7 40a6.3 6.3 0 1 1 6.3 6.3a3.08 3.08 0 0 1 -2.8 -4.2" fill="none"/><circle cx="6" cy="70" r="13"/><path d="M0.15 70a5.85 5.85 0 1 1 5.85 5.85a2.86 2.86 0 0 1 -2.6 -3.9" fill="none"/><circle cx="14" cy="98" r="12"/><path d="M8.6 98a5.4 5.4 0 1 1 5.4 5.4a2.64 2.64 0 0 1 -2.4 -3.6" fill="none"/>
      </g>
    </g>

    <!-- vállak, felső -->
    <path d="M40 500c0-80 40-118 115-128h30c75 10 115 48 115 128Z" fill="#668559"/>
    <!-- kötény pánt -->
    <path d="M118 382 136 500M222 382l-18 118" stroke="#e5efdf" stroke-width="10" stroke-linecap="round" opacity=".55"/>
    <!-- nyak -->
    <path d="M150 300h40v78c-8 10-32 10-40 0Z" fill="#e9c3a8"/>
    <!-- fül -->
    <ellipse cx="121" cy="258" rx="8" ry="13" fill="#e9c3a8"/>
    <!-- arc -->
    <ellipse cx="170" cy="252" rx="48" ry="62" fill="#f1d3bd"/>
    <path d="M132 286c10 22 24 30 38 30s28-8 38-30" fill="none" stroke="#e2b89c" stroke-width="2"/>
    <!-- pír az arcon -->
    <g fill="#ee97ba" opacity=".3">
      <ellipse cx="148" cy="279" rx="9" ry="5"/>
      <ellipse cx="203" cy="279" rx="9" ry="5"/>
    </g>
    <!-- szemöldök (szőkés, a hajhoz illő) -->
    <g fill="none" stroke="#a37a4a" stroke-width="3" stroke-linecap="round">
      <path d="M143 242c6-4 14-5 21-2"/>
      <path d="M185 240c7-3 15-2 21 2"/>
    </g>
    <!-- zöld szemek: fehér mandulaforma, zöld írisz, pupilla, csillanás, felső szemhéj -->
    <g id="szem-bal">
      <path d="M144 258c5-7 18-7 23 0c-5 6-18 6-23 0Z" fill="#fff"/>
      <circle cx="155.5" cy="258" r="4.4" fill="#6aa35a" stroke="#4a6b40" stroke-width="1.1"/>
      <circle cx="155.5" cy="258" r="2" fill="#2b2622"/>
      <circle cx="157" cy="256.6" r="1.2" fill="#fff"/>
      <path d="M143 258c5-8 19-8 25 0M143 258l-3-3" fill="none" stroke="#5a3a22" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <g>
      <path d="M183 258c5-7 18-7 23 0c-5 6-18 6-23 0Z" fill="#fff"/>
      <circle cx="194.5" cy="258" r="4.4" fill="#6aa35a" stroke="#4a6b40" stroke-width="1.1"/>
      <circle cx="194.5" cy="258" r="2" fill="#2b2622"/>
      <circle cx="196" cy="256.6" r="1.2" fill="#fff"/>
      <path d="M182 258c5-8 19-8 25 0M207 258l3-3" fill="none" stroke="#5a3a22" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <!-- orr és mosoly -->
    <path d="M177 266c-1 7-3 11 0 13 2 1 5 1 7 0" fill="none" stroke="#d9a587" stroke-width="2" stroke-linecap="round"/>
    <path d="M164 291c7 6 19 6 26 0" fill="none" stroke="#c8706f" stroke-width="2.6" stroke-linecap="round"/>
    <!-- fülbevalók: két kis karika és egy pötty – egy kis vagányság -->
    <g fill="none" stroke="#ee97ba" stroke-width="2.5">
      <circle cx="117" cy="270" r="5"/>
      <circle cx="115" cy="259" r="3.5"/>
    </g>
    <circle cx="118" cy="248" r="2.5" fill="#ee97ba"/>

    <!-- rövid, vagány szőke frizura -->
    <!-- felnyírt oldal (undercut): rövid, sötétebb tövek -->
    <path d="M120 248c-6-20-6-42 2-60 6-10 14-16 22-18l-4 20c-10 10-14 30-12 56Z" fill="#b48c5c" opacity=".85"/>
    <g stroke="#9a7448" stroke-width="1.4" stroke-linecap="round" opacity=".6">
      <path d="M124 236v-8M128 230v-9M126 214v-8M131 206v-8M135 198v-7M122 222v-7"/>
    </g>
    <!-- sötétebb tövek a fejtetőn -->
    <path d="M136 186c10-30 36-46 66-42 22 4 38 18 42 40-30-10-70-10-108 2Z" fill="#b98e58"/>
    <!-- a tető: simán, oldalra fésült, dús tincsek -->
    <path d="M130 196c-4-32 18-58 54-62 34-4 62 16 64 50 0 8-2 16-4 22-34-14-78-18-114-10Z" fill="url(#hair)"/>
    <!-- hosszú, oldalra söpört frufru hegyes végekkel -->
    <path d="M140 196c28-24 72-28 104-8 6 8 8 18 6 30l-10-6 2 16-12-8-2 18c-4-20-16-34-34-40-18 0-36 4-54-2Z" fill="#efd39b"/>
    <path d="M214 204c14 8 20 22 16 42l8-12 4 10c4-14 2-28-6-40Z" fill="#dfba7c"/>
    <!-- fények -->
    <g fill="none" stroke="#fff6dc" stroke-width="2.4" stroke-linecap="round">
      <path d="M152 168c16-14 38-20 60-16"/>
      <path d="M160 190c18-10 40-14 60-8"/>
      <path d="M164 150c14-8 32-10 48-6"/>
    </g>
    <g fill="none" stroke="#b98e58" stroke-width="1.8" stroke-linecap="round" opacity=".7">
      <path d="M150 200c16 4 34 4 50 0"/>
      <path d="M232 214c4 8 4 18 2 26"/>
    </g>
  </g>

</svg>
